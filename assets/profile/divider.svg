<svg xmlns="http://www.w3.org/2000/svg" width="840" height="40" viewBox="0 0 840 40" role="img" aria-label="">
  <style>
    .bullet { animation: fire 3s cubic-bezier(.6,0,.4,1) infinite; }
    @keyframes fire {
      0% { transform: translateX(-120px); opacity: 0; }
      8% { opacity: 1; }
      85% { transform: translateX(860px); opacity: 1; }
      100% { transform: translateX(860px); opacity: 0; }
    }
    .trail { animation: trail 3s cubic-bezier(.6,0,.4,1) infinite; transform-box: fill-box; transform-origin: left center; }
    @keyframes trail {
      0% { transform: scaleX(0); opacity: 0; }
      10% { opacity: .9; }
      85% { transform: scaleX(1); opacity: .9; }
      100% { transform: scaleX(1); opacity: 0; }
    }
    .label { font: 700 8px 'Arial Black', Impact, sans-serif; letter-spacing: 1px; fill: #0D0D0D; }
  </style>
  <line x1="0" y1="20" x2="840" y2="20" stroke="#FF2E88" stroke-width="1" opacity=".35"/>
  <rect class="trail" x="0" y="19" width="840" height="2" fill="#FF2E88"/>
  <g class="bullet">
    <path d="M0,14 L70,14 Q92,14 100,20 Q92,26 70,26 L0,26 Z" fill="#FFD400"/>
    <rect x="0" y="14" width="16" height="12" fill="#FF2E88"/>
    <text x="22" y="24" class="label">TRUTH</text>
  </g>
</svg>
